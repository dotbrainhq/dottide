# One Linux job per pull request: lint and unit tests, no network calls, no macOS runners.
# Kept small on purpose so a new account never looks like it is burning CI.
# Every pull request runs it, docs included, because main requires "CI passed" to merge.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-passed:
    name: CI passed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
