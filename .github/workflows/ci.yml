# One Linux job: lint and unit tests, no network calls, no macOS runners.
# It only runs when started by hand (Actions tab, then Run workflow). The account is new
# and was flagged once for frequent CI, so checks run locally before every push instead.
# Branch protection, when added, requires this job's name: "CI passed".
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-passed:
    name: CI passed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
