[project]
name = "dottide"
version = "0.1.0"
description = "Read-only numbers for every site and product you run, across Google accounts, for people and AI agents."
readme = "README.md"
license = "MIT"
keywords = ["mcp", "mcp-server", "google-search-console", "google-analytics", "ga4", "seo", "analytics", "ai-agents", "claude", "cli"]
requires-python = ">=3.12"
dependencies = [
    "google-auth[requests]>=2.40",
    "httpx>=0.28",
    "mcp>=2.3",
]

[project.scripts]
dottide = "dottide.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
