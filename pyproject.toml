[project]
name = "dottide"
version = "0.3.1"
description = "Read-only numbers for every site and product you run, across Google accounts, for people and AI agents."
readme = "README.md"
license = "MIT"
keywords = ["mcp", "mcp-server", "google-search-console", "google-analytics", "ga4", "seo", "analytics", "ai-agents", "claude", "cli"]
requires-python = ">=3.12"
authors = [{ name = "Dotbrain LLC", email = "hello@dotbrainhq.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "google-auth[requests]>=2.40",
    "httpx>=0.28",
    "keyring>=25; sys_platform != 'darwin'",
    "mcp>=2.3",
]

[project.urls]
Homepage = "https://github.com/dotbrainhq/dottide"
Documentation = "https://github.com/dotbrainhq/dottide/tree/main/docs"
Issues = "https://github.com/dotbrainhq/dottide/issues"
Changelog = "https://github.com/dotbrainhq/dottide/blob/main/CHANGELOG.md"

[project.scripts]
dottide = "dottide.server:main"

[dependency-groups]
dev = ["keyring>=25", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
